# Build + publish Vanta Beta Windows installer to GitHub Releases.
# Non-technical users download from the admin /download page (one button).
name: Build desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
      - "vanta-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            executor/package-lock.json

      - name: Install desktop deps
        run: npm ci

      - name: Stage executor + bundled Node
        run: node scripts/stage-win-resources.cjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build Windows installer
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanta-beta-windows
          path: |
            desktop/release/Vanta-Beta-Setup.exe
            desktop/release/Vanta-Beta-Portable.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('vanta-desktop-{0}', github.run_number) }}
          name: Vanta Beta Windows ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          body: |
            **Vanta Beta** for Windows.

            1. Download **Vanta-Beta-Setup.exe**
            2. Run the installer (Windows may ask to allow it — click More info → Run anyway if unsigned)
            3. Open **Vanta Beta** and paste your API key from the admin dashboard

            Installed builds auto-check this release for updates (`latest.yml`).
            Portable build is optional (no install / limited auto-update).
          files: |
            desktop/release/Vanta-Beta-Setup.exe
            desktop/release/Vanta-Beta-Portable.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
