# Build signed-ready Windows desktop installer (NSIS + portable).
# Runs on windows-latest so Wine is not required.
name: Build desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            executor/package-lock.json

      - name: Install desktop deps
        run: npm ci

      - name: Stage executor + bundled Node
        run: node scripts/stage-win-resources.cjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build Windows installer
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: j1ms-bot-windows
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: error
