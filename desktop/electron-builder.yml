{
  "appId": "com.j1ms.bot.desktop",
  "productName": "J1m's Bot",
  "copyright": "Copyright © J1m's Bot",
  "directories": {
    "output": "release",
    "buildResources": "buildResources"
  },
  "files": [
    "**/*",
    "!release/**",
    "!build/**",
    "!scripts/**",
    "!**/*.test.cjs",
    "!**/*.int.test.cjs",
    "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}",
    "!**/node_modules/.cache/**"
  ],
  "extraResources": [
    {
      "from": "build/win-resources/executor",
      "to": "executor",
      "filter": ["**/*"]
    },
    {
      "from": "build/win-resources/node",
      "to": "node",
      "filter": ["**/*"]
    }
  ],
  "asar": true,
  "win": {
    "target": [
      {
        "target": "nsis",
        "arch": ["x64"]
      },
      {
        "target": "portable",
        "arch": ["x64"]
      }
    ],
    "artifactName": "J1msBot-Setup-${version}-${arch}.${ext}",
    "signAndEditExecutable": false
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true,
    "shortcutName": "J1m's Bot",
    "deleteAppDataOnUninstall": false,
    "artifactName": "J1msBot-Setup-${version}.${ext}"
  },
  "portable": {
    "artifactName": "J1msBot-Portable-${version}.${ext}"
  }
}
