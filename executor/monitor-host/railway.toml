# Railway — Bandai always-on stock monitor (separate from dashboard / Fly executor)
#
# Service settings:
#   Root Directory = executor
#   Config file    = monitor-host/railway.toml  (or set dockerfile path below)
#
# Variables (required for useful polls):
#   BANDAI_MONITOR_DC_PROXIES   multiline DC list (bootstrap only)
#   BANDAI_MONITOR_ISP_PROXIES  optional AU ISP slice (bootstrap / env OSPs)
#   BANDAI_MONITOR_KEYWORDS     e.g. GUNDAM,ONE PIECE,N2890904001
#   BANDAI_MONITOR_INTERVAL_MS  e.g. 3000–5000 for drip hunting
#   MONITOR_TOKEN               Bearer for /status /events /hits
#   Attach a Railway volume at /data so admin ISP/DC saves survive redeploys.

[build]
builder = "DOCKERFILE"
dockerfilePath = "monitor-host/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
