# Railway project `j1ms-bandai-monitor` — always-on Bandai stock monitor.
# Checkout executor stays on Fly.io (`executor/Dockerfile`).
#
# Service settings:
#   Root Directory = executor
#   This railway.toml selects the slim monitor image (no Playwright / Chrome).

[build]
builder = "DOCKERFILE"
dockerfilePath = "monitor-host/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
